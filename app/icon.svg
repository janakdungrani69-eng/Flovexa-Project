<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faefdc" />
      <stop offset="30%" stop-color="#dfbe8d" />
      <stop offset="65%" stop-color="#c49a60" />
      <stop offset="100%" stop-color="#8a6332" />
    </linearGradient>
    <linearGradient id="borderGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faefdc" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#be955f" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8a6332" stop-opacity="0.8" />
