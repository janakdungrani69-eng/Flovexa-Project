    <path d="M 0 -38 Q 0 0 38 0 Q 0 0 0 38 Q 0 0 -38 0 Q 0 0 0 -38 Z" />
    <circle cx="0" cy="0" r="7" fill="#ffffff" opacity="0.9" />
  </g>

